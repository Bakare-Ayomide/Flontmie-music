name: Build Flontmie Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Flontmie.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 (Required for Capacitor 8 / Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck & Build Web Application
        run: |
          npm run lint
          npm run build

      - name: Ensure & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode Release Keystore (Optional if Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/flontmie-release.keystore
            echo "Release keystore decoded for signed production APK."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided; building installable APK with default signing."
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "app/flontmie-release.keystore" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Flontmie.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Flontmie.apk
          fi

      - name: Verify Flontmie.apk Output
        run: ls -lh Flontmie.apk

      - name: Upload Flontmie.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flontmie.apk
          path: Flontmie.apk
          if-no-files-found: error
          retention-days: 30
