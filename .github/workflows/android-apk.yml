name: Build Flontmie Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Flontmie.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept All Licenses
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "$ANDROID_SDK_DIR/licenses/intel-android-extra-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_SDK_DIR/licenses/google-gdk-license"
          echo "Android SDK ready at $ANDROID_SDK_DIR with all licenses accepted."

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Production Web Bundle
        run: npm run build

      - name: Prepare & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -f "node_modules/@capacitor/cli/assets/android-template.tar.gz" ]; then
            mkdir -p /tmp/cap-template
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C /tmp/cap-template
            mkdir -p android/gradle/wrapper
            cp -f /tmp/cap-template/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            cp -f /tmp/cap-template/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
            cp -f /tmp/cap-template/gradlew android/gradlew
            cp -f /tmp/cap-template/build.gradle android/build.gradle
            cp -f /tmp/cap-template/variables.gradle android/variables.gradle
            for png in $(find /tmp/cap-template/app/src/main/res -name "*.png"); do
              rel="${png#/tmp/cap-template/}"
              mkdir -p "android/$(dirname "$rel")"
              cp -f "$png" "android/$rel"
            done
          fi
          npx cap sync android
          chmod +x android/gradlew
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Decode Release Keystore (Optional if Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/flontmie-release.keystore
            echo "Release keystore decoded for signed production APK."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided; building signed installable APK."
          fi

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "app/flontmie-release.keystore" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$APK_PATH" ../Flontmie.apk
          else
            ./gradlew assembleDebug -x lint --no-daemon --stacktrace
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            cp "$APK_PATH" ../Flontmie.apk
          fi

      - name: Verify Flontmie.apk Output
        run: ls -lh Flontmie.apk

      - name: Upload Flontmie.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flontmie.apk
          path: Flontmie.apk
          if-no-files-found: error
          retention-days: 30
